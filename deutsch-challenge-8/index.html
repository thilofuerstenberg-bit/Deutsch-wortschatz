u trinken?"],["Du möchtest die Jacke vor dem Kauf testen.","Kann ich die Jacke anprobieren?","Kann ich die Jacke besuchen?","Kann ich die Jacke lernen?"],["Eine Pizza kostet 4,90 € und ein Kakao 1 €. Wie viel bezahlst du?","5,90 €","6,90 €","4,00 €"],["Du kaufst eine Bratwurst (2 €) und Kuchen (1,50 €). Du gibst 5 €. Wie viel bekommst du zurück?","1,50 €","2,50 €","0,50 €"],["Du findest die Jacke schön, aber zu teuer.","Die Jacke gefällt mir, aber sie ist zu teuer.","Die Jacke gefällt mich, denn zu teuer.","Die Jacke ist teuer seit mir."]],"Meinungen":[["Du bist einverstanden.","Das finde ich auch.","Das stimmt nicht.","Ich glaube nicht."],["Du bist nicht einverstanden.","Ich glaube das nicht.","Du hast recht.","Genau!"],["Wie begründest du deine Meinung?","weil","oder","aber"],["Welche Aussage ist eine Meinung?","Mode macht Spaß.","Die Pizza kostet 4,90 €.","Das ist eine Jacke."],["Jemand sagt: „Jugendliche brauchen kein Taschengeld.“ Du widersprichst höflich.","Ich sehe das anders, weil man sparen lernen muss.","Das stimmt und ich stimme nicht.","Ich hätte seit Geld."],["Ergänze: „Ich finde Mode wichtig, ___ ich mich gern schön anziehe.“","weil","denn","oder"],["Welche Aussage enthält ein Argument?","25 Euro sind zu wenig, weil Busfahrten viel kosten.","25 Euro sind zu wenig.","Ich habe 25 Euro."],["Du möchtest einer Meinung teilweise zustimmen.","Da hast du teilweise recht, aber …","Das ist ein Pullover.","Ich hätte gern einen Kakao."],["Welche Antwort passt? „Mode macht Spaß!“","Das finde ich auch, weil man kreativ sein kann.","Seit einem Jahr.","In Größe M, bitte."],["Was passt zu einer Diskussion?","Ich glaube, dass 25 Euro im Monat nicht genug sind.","Ich hätte gern eine Pizza.","Wo ist die Umkleidekabine?"]],"der/das/die":[["___ Rock gefällt mir.","Der","Den","Das"],["Ich finde ___ Rock schön.","den","der","das"],["___ Kleid ist neu.","Das","Den","Die"],["Ich kaufe ___ Schuhe.","die","den","das"],["___ Jacke ist schön.","Die","Das","Den"],["Ich finde ___ Pul let questions=[],index=0,score=0,answered=false,mode="training",student="";
const $=id=>document.getElementById(id),shuffle=a=>[...a].sort(()=>Math.random()-.5);
function start(){student=$("name").value.trim();if(!student){alert("Bitte gib einen Vornamen oder Spitznamen ein.");return}mode=$("mode").value;const t=$("topic").value;questions=shuffle(Object.entries(topics).flatMap(([topic,arr])=>arr.filter(()=>t==="all"||t===topic).map(q=>({topic,q}))));if(mode==="test")questions=questions.slice(0,Math.min(30,questions.length));index=score=0;$("setup").classList.add("hidden");$("results").classList.add("hidden");$("game").classList.remove("hidden");show()}
function show(){answered=false;const {topic,q}=questions[index];$("progress").textContent=(index+1)+"/"+questions.length+" · "+score+" Punkte";$("category").textContent=topic;$("question").textContent=q[0];$("feedback").textContent="";$("next").classList.add("hidden");$("answers").innerHTML="";shuffle(q.slice(1)).forEach(a=>{const b=document.createElement("button");b.className="choice";b.textContent=a;b.onclick=()=>answer(a,b);$("answers").append(b)})}
function answer(a,b){if(answered)return;answered=true;const correct=questions[index].q[1];if(a===correct)score++;document.querySelectorAll(".choice").forEach(el=>{el.disabled=true;if(el.textContent===correct)el.style.background="#21774d";else if(el===b)el.style.background="#a43c53"});$("feedback").textContent=mode==="training"?(a===correct?"✓ Richtig!":"✗ Richtig: "+correct):"Antwort gespeichert";$("next").classList.remove("hidden")}
async function advance(){index++;if(index<questions.length)return show();$("game").classList.add("hidden");$("results").classList.remove("hidden");const pct=Math.round(score/questions.length*100);$("summary").textContent=student+": "+score+"/"+questions.length+" ("+pct+" %)";if(mode==="test"){try{const r=await fetch(URL+"/rest/v1/deutsch_challenge_scores",{method:"POST",headers:{"apikey":KEY,"Content-Type":"application/json","Prefer":"return=minimal"},body:JSON.stringify({name:student,score,total:questions.length,percentage:pct})});if(!r.ok)throw Error(r.status)}catch(e){$("summary").textContent+=" · ⚠ Ergebnis konnte nicht gespeichert werden."}}renderBoard()}
function reset(){$("results").classList.add("hidden");$("setup").classList.remove("hidden")}
async function renderBoard(){try{const r=await fetch(URL+"/rest/v1/deutsch_challenge_scores?select=name,score,total,percentage&order=percentage.desc&limit=200",{headers:{apikey:KEY}});if(!r.ok)throw Error(r.status);const rows=await r.json(),best=new Map();rows.forEach(x=>{if(!best.has(x.name)||best.get(x.name).percentage<x.percentage)best.set(x.name,x)});$("board").innerHTML="";[...best.values()].sort((a,b)=>b.percentage-a.percentage||b.score-a.score).slice(0,25).forEach(x=>{const li=document.createElement("li");li.textContent=x.name+" — "+x.percentage+"% ("+x.score+"/"+x.total+")";$("board").append(li)});$("boardstatus").textContent="🌐 Gemeinsame Online-Rangliste"}catch(e){$("boardstatus").textContent="⚠ Rangliste derzeit nicht erreichbar"}}renderBoard();
