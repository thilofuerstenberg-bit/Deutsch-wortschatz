<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deutsch Challenge 8</title><style>body{background:#10182b;color:#f6f7ff;font:17px system-ui;margin:0}main{max-width:720px;margin:auto;padding:22px}section{background:#202e49;padding:22px;border-radius:20px;margin:16px 0}button,input,select{font:inherit;border:0;border-radius:12px;padding:12px;margin:5px}button{background:#ffcb59;color:#1b2435;font-weight:700;cursor:pointer}button.choice{display:block;width:100%;text-align:left;background:#364966;color:white}button:disabled{opacity:.75}input,select{max-width:90%}.hidden{display:none}.muted{color:#b8c5de}#feedback{font-weight:bold}h1{color:#ffcb59}li{padding:5px}</style><main><h1>🎮 Deutsch Challenge 8</h1><p>Kapitel 8 · Trainieren, testen und gemeinsam Punkte sammeln!</p><section id="setup"><h2>Los geht's!</h2><input id="name" maxlength="30" placeholder="Dein Vorname"><p><select id="mode"><option value="training">🧠 Training – mit Feedback</option><option value="test">🏆 Test – mit Rangliste</option></select><select id="topic"><option value="all">Alle Themen</option><option>Kleidung</option><option>Einkaufen</option><option>Meinungen</option><option>der/das/die</option><option>hätte</option><option>Adjektive</option><option>seit + Dativ</option></select></p><button onclick="start()">Starten ▶</button></section><section id="game" class="hidden"><p id="progress" class="muted"></p><h3 id="category"></h3><h2 id="question"></h2><div id="answers"></div><p id="feedback"></p><button id="next" class="hidden" onclick="advance()">Weiter →</button></section><section id="results" class="hidden"><h2>🎉 Geschafft!</h2><p id="summary"></p><button onclick="reset()">Noch einmal</button></section><section><h2>🏆 Klassen-Rangliste</h2><p id="boardstatus" class="muted">Wird geladen …</p><button onclick="renderBoard()">↻ Aktualisieren</button><ol id="board"></ol></section><p class="muted">Hinweis: Nutze nur Vornamen oder Spitznamen. Ergebnisse werden online geteilt.</p></main><script>
const URL="https://xdnqnngenhwkzubcijud.supabase.co",KEY="sb_publishable_zqk_oUhB8G3LI6DHYcildQ_4hsYkv95",topics={"Kleidung":[["Was trägt man auf dem Kopf?","die Mütze","die Hose","der Rock"],["Welche Kleidung trägt man an den Füßen?","die Schuhe","die Jacke","die Tasche"],["Was ist ein Rock?","ein Kleidungsstück","ein Getränk","ein Gerät"],["Welche Farbe hat eine blaue Jacke?","blau","rot","grün"]],"Einkaufen":[["Hose zu lang. Was sagst du?","Haben Sie eine andere Größe?","Wo ist die Schule?","Ich habe Hunger."],["Du möchtest etwas anprobieren.","Wo sind die Umkleidekabinen?","Wie alt sind Sie?","Was kostet das Brot?"],["Du möchtest eine Jacke in Blau.","Haben Sie die Jacke in Blau?","Ich bin blau.","Die Jacke ist gestern."],["Eine Pizza kostet 4,90 €. Zwei kosten …","9,80 €","8,90 €","10,80 €"]],"Meinungen":[["Du bist einverstanden.","Das finde ich auch.","Das stimmt nicht.","Ich glaube nicht."],["Du bist nicht einverstanden.","Ich glaube das nicht.","Du hast recht.","Genau!"],["Wie begründest du deine Meinung?","weil","oder","aber"],["Welche Aussage ist eine Meinung?","Mode macht Spaß.","Die Pizza kostet 4,90 €.","Das ist eine Jacke."]],"der/das/die":[["___ Rock gefällt mir.","Der","Den","Das"],["Ich finde ___ Rock schön.","den","der","das"],["___ Kleid ist neu.","Das","Den","Die"],["Ich kaufe ___ Schuhe.","die","den","das"],["___ Jacke ist schön.","Die","Das","Den"],["Ich finde ___ Pullover toll.","den","der","das"]],"hätte":[["Ich ___ gern ein neues Handy.","hätte","hättest","hätten"],["Du ___ gern einen Rock.","hättest","hätte","hätten"],["Wir ___ gern Kuchen.","hätten","hättet","hätte"],["Ihr ___ gern Pizza.","hättet","hätten","hättest"],["Sie (Plural) ___ gern Kakao.","hätten","hätte","hättest"],["Was ___ du gern?","hättest","hätte","hätten"]],"Adjektive":[["Das ist ein ___ Handy.","neues","neuen","neuem"],["Ich kaufe einen ___ Pullover.","neuen","neuer","neues"],["Mit einem ___ Betrag …","kleinen","kleiner","kleines"],["Ich möchte einen ___ Rock.","kurzen","kurzer","kurzes"],["Das ist eine ___ Idee.","blöde","blöden","blödes"],["Ich kaufe mir gern ___ Klamotten.","tolle","tollen","tolles"]],"seit + Dativ":[["Seit ___ Jahr lerne ich Deutsch.","einem","einen","ein"],["Seit ___ Woche habe ich Ferien.","einer","eine","einen"],["Seit ___ Geburtstag habe ich das Handy.","meinem","meinen","mein"],["Ich wohne hier seit zwei ___.","Monaten","Monate","Monat"],["Seit ___ bin ich krank.","gestern","gestrigen","gesternem"],["Welche Form ist richtig?","seit einem Monat","seit einen Monat","seit ein Monat"]]};
let questions=[],index=0,score=0,answered=false,mode="training",student="";
const $=id=>document.getElementById(id),shuffle=a=>[...a].sort(()=>Math.random()-.5);
function start(){student=$("name").value.trim();if(!student){alert("Bitte gib einen Vornamen oder Spitznamen ein.");return}mode=$("mode").value;const t=$("topic").value;questions=shuffle(Object.entries(topics).flatMap(([topic,arr])=>arr.filter(()=>t==="all"||t===topic).map(q=>({topic,q}))));if(mode==="test")questions=questions.slice(0,Math.min(20,questions.length));index=score=0;$("setup").classList.add("hidden");$("results").classList.add("hidden");$("game").classList.remove("hidden");show()}
function show(){answered=false;const {topic,q}=questions[index];$("progress").textContent=(index+1)+"/"+questions.length+" · "+score+" Punkte";$("category").textContent=topic;$("question").textContent=q[0];$("feedback").textContent="";$("next").classList.add("hidden");$("answers").innerHTML="";shuffle(q.slice(1)).forEach(a=>{const b=document.createElement("button");b.className="choice";b.textContent=a;b.onclick=()=>answer(a,b);$("answers").append(b)})}
function answer(a,b){if(answered)return;answered=true;const correct=questions[index].q[1];if(a===correct)score++;document.querySelectorAll(".choice").forEach(el=>{el.disabled=true;if(el.textContent===correct)el.style.background="#21774d";else if(el===b)el.style.background="#a43c53"});$("feedback").textContent=mode==="training"?(a===correct?"✓ Richtig!":"✗ Richtig: "+correct):"Antwort gespeichert";$("next").classList.remove("hidden")}
async function advance(){index++;if(index<questions.length)return show();$("game").classList.add("hidden");$("results").classList.remove("hidden");const pct=Math.round(score/questions.length*100);$("summary").textContent=student+": "+score+"/"+questions.length+" ("+pct+" %)";if(mode==="test"){try{const r=await fetch(URL+"/rest/v1/deutsch_challenge_scores",{method:"POST",headers:{"apikey":KEY,"Content-Type":"application/json","Prefer":"return=minimal"},body:JSON.stringify({name:student,score,total:questions.length,percentage:pct})});if(!r.ok)throw Error(r.status)}catch(e){$("summary").textContent+=" · ⚠ Ergebnis konnte nicht gespeichert werden."}}renderBoard()}
function reset(){$("results").classList.add("hidden");$("setup").classList.remove("hidden")}
async function renderBoard(){try{const r=await fetch(URL+"/rest/v1/deutsch_challenge_scores?select=name,score,total,percentage&order=percentage.desc&limit=200",{headers:{apikey:KEY}});if(!r.ok)throw Error(r.status);const rows=await r.json(),best=new Map();rows.forEach(x=>{if(!best.has(x.name)||best.get(x.name).percentage<x.percentage)best.set(x.name,x)});$("board").innerHTML="";[...best.values()].sort((a,b)=>b.percentage-a.percentage||b.score-a.score).slice(0,25).forEach(x=>{const li=document.createElement("li");li.textContent=x.name+" — "+x.percentage+"% ("+x.score+"/"+x.total+")";$("board").append(li)});$("boardstatus").textContent="🌐 Gemeinsame Online-Rangliste"}catch(e){$("boardstatus").textContent="⚠ Rangliste derzeit nicht erreichbar"}}renderBoard();
</script></html>
